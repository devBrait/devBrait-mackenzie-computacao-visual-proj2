# Compila a versão web e publica no GitHub Pages a cada push na main
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Permite rodar à mão pela aba Actions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy novo cancela o anterior que ainda não terminou
concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Mesma versão usada nas nossas máquinas
  EMSDK_VERSION: 6.0.13

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}

      # O emcc já está no PATH, então não usamos o caminho do Windows
      - name: Build web version
        run: make web EMCC=emcc

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
